<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Ответы / ГО</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"><script src="api-config.js" defer></script><script src="admin.js" defer></script></head><body><main class="admin-shell"><p class="eyebrow">ГРАЖДАНСКАЯ ОБОРОНА / ИНСТРУКТОР</p><h1>Полученные ответы</h1><form id="login"><label>Ключ администратора<input id="key" type="password" required autocomplete="current-password"></label><button class="primary">ВОЙТИ</button></form><p id="status" role="status"></p><section id="dashboard" hidden><section class="access-key-panel"><h2>Допуск к тесту</h2><label for="key-test">Тест</label><select id="key-test"><option value="СОЗ">СОЗ — Охранное звено</option></select><p>Ключ действует 30 минут и может использоваться несколькими сотрудниками. Ограничение попыток сохраняется.</p><button id="create-access-key" class="primary">СОЗДАТЬ КЛЮЧ НА 30 МИНУТ</button><p id="access-key-status" role="status"></p><div id="access-key-result" hidden><label for="generated-access-key">Ключ для участников</label><input id="generated-access-key" readonly><p id="access-key-expiry"></p><button id="copy-access-key">КОПИРОВАТЬ КЛЮЧ</button></div></section><div class="admin-tools"><button id="refresh">ОБНОВИТЬ</button><button id="logout">ВЫЙТИ</button></div><div id="submissions"></div><div class="admin-tools"><button id="previous">ПРЕДЫДУЩИЕ</button><span id="page"></span><button id="next">СЛЕДУЮЩИЕ</button></div></section></main></body></html>
